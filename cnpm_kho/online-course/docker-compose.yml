services:
  mysql:
    image: mysql:8.0
    container_name: online-course-mysql
    environment:
      MYSQL_ROOT_PASSWORD: course123
      MYSQL_DATABASE: online_course_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  # Giao diện web để xem database MySQL trong Docker
  adminer:
    image: adminer:4
    container_name: online-course-adminer
    ports:
      - "8082:8080"
    depends_on:
      - mysql
    restart: unless-stopped

volumes:
  mysql_data: