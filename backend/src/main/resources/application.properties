spring.application.name=online-course-backend

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/online_course_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:course123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:true}
spring.jpa.open-in-view=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT Configuration (secret must be at least 32 characters for HS256)
app.jwt.secret=${JWT_SECRET:online_course_jwt_secret_key_2026_at_least_32_chars_long}
app.jwt.expiration=${JWT_EXPIRATION:1h}

# CORS: frontend origins allowed to call the API (Vite: 5173, Create React App: 3000)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
