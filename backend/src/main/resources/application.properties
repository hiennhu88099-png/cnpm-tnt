spring.application.name=online-course-backend

# Tu dong doc file .env o thu muc goc du an hoac thu muc backend (neu co)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/online_course_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:course123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:true}
spring.jpa.open-in-view=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT Configuration (secret must be at least 32 characters for HS256)
app.jwt.secret=${JWT_SECRET:online_course_jwt_secret_key_2026_at_least_32_chars_long}
app.jwt.expiration=${JWT_EXPIRATION:1h}

# CORS: frontend origins allowed to call the API (Vite: 5173, Create React App: 3000)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Payment / VietQR & SePay Configuration
app.payment.bank-code=${SEPAY_BANK_CODE:MB}
app.payment.bank-name=${SEPAY_BANK_NAME:MB Bank (Ng\u00e2n h\u00e0ng Qu\u00e2n \u0110\u1ed9i)}
app.payment.account-number=${SEPAY_ACCOUNT_NUMBER:0000012345678}
app.payment.account-holder=${SEPAY_ACCOUNT_HOLDER:EDUHUB ACADEMY}
app.payment.transfer-prefix=${SEPAY_PREFIX:EDUHUB}
app.payment.webhook-secret=${SEPAY_WEBHOOK_SECRET:}
