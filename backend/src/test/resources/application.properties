# Test configuration: replaces src/main/resources/application.properties on the test classpath,
# so tests run without MySQL/Docker and without a JWT_SECRET environment variable.

# In-memory H2 in MySQL mode, recreated for every test run
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Test-only secret (never used outside tests)
app.jwt.secret=test-only-jwt-secret-0123456789abcdefghijklmnop
app.jwt.expiration=1h

app.cors.allowed-origins=http://localhost:5173
