# Test configuration: replaces src/main/resources/application.properties on the test classpath,
# so tests run without MySQL/Docker and without a JWT_SECRET environment variable.

# In-memory H2 in MySQL mode, recreated for every test run
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Test-only secret (never used outside tests)
app.jwt.secret=test-only-jwt-secret-0123456789abcdefghijklmnop
app.jwt.expiration=1h

app.cors.allowed-origins=http://localhost:5173

# Payment / SePay test configuration
app.payment.bank-code=MB
app.payment.bank-name=MB Bank (Ngân hàng Quân Đội)
app.payment.account-number=0000012345678
app.payment.account-holder=EDUHUB ACADEMY
app.payment.transfer-prefix=EDUHUB
app.payment.webhook-secret=
