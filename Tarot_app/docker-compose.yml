version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: soul_mirror_db
    environment:
      POSTGRES_DB: soul_mirror
      POSTGRES_USER: soul_user
      POSTGRES_PASSWORD: soul_secret_2024
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soul_user -d soul_mirror"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soul_mirror_api
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/soul_mirror
      - SPRING_DATASOURCE_USERNAME=soul_user
      - SPRING_DATASOURCE_PASSWORD=soul_secret_2024
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
